<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <div class="cloud cloud-1">☁</div>
        <div class="cloud cloud-2">☁</div>
        <div class="cloud cloud-3">☁</div>

        <div class="moon">☾</div>

        <div class="star star-1">✦</div>
        <div class="star star-2">✧</div>
        <div class="star star-3">✦</div>
        <div class="star star-4">✧</div>
        <div class="star star-5">✦</div>

        <div class="snow-container"></div>

        <div class="sparkles"></div>

    </div>


    <!-- Cute decorations -->

    <div class="sticker penguin">🐧</div>
    <div class="sticker seal">🦭</div>
    <div class="sticker whale">🐳</div>
    <div class="sticker polar">🐻‍❄️</div>
    <div class="sticker snowman">☃️</div>
    <div class="sticker sparkle-1">✦</div>
    <div class="sticker sparkle-2">✧</div>
    <div class="sticker sparkle-3">❄</div>


    <!-- Main card -->

    <main class="card">

        <!-- Start screen -->

        <section id="start-screen">

            <div class="top-decoration">
                ❄
            </div>

            <p class="mini-title">
                A LITTLE SURPRISE
            </p>

            <h1>
                Dành cho cậu
            </h1>

            <p class="intro">
                Quang nói một xíu này<br>
                nhanh thôi nhé.
            </p>

            <button id="start-btn">
                MỞ RA
            </button>
            <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

            <div class="bottom-decoration">
                ✦　❄　✦
            </div>

        </section>


        <!-- Message screen -->

        <section id="message-screen" class="hidden">

            <div id="content"></div>

            <button id="next-btn">
                TIẾP TỤC
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
